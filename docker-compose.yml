services:
  php:
    build:
      context: ./.docker/php
    container_name: luckygame_php
    volumes:
      - ./src:/var/www/html
    networks:
      - luckygame_network
    restart: no
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_NAME:-luckygame_db}
      DB_USERNAME: ${DB_USER:-luckygameuser}
      DB_PASSWORD: ${DB_PASSWORD:-luckygameuserpassword}

  node:
    image: node:24
    container_name: luckygame_node
    restart: no
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    command: sh -c "npm install && npm run build"
    networks:
      - luckygame_network

  nginx:
    image: nginx:1.29.3
    container_name: luckygame_nginx
    ports:
      - "${WEB_SERVER_PORT:-80}:80"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - NGINX_ENVSUBST_FILTER=^DOMAIN$
    volumes:
      - ./src:/var/www/html
      - ./.docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template
    depends_on:
      - php
    networks:
      - luckygame_network
    restart: no

  mysql:
    image: mysql:8.0
    container_name: luckygame_mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dbrootpassword}
      MYSQL_USER: ${DB_USER:-luckygameuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-luckygameuserpassword}
      MYSQL_DATABASE: ${DB_NAME:-luckygame_db}
    volumes:
      - ./.docker/data/mysql:/var/lib/mysql
    networks:
      - luckygame_network
    restart: no

networks:
  luckygame_network:
    driver: bridge
